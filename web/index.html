<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ArenaLab 实验场</title><link rel="stylesheet" href="/style.css"></head>
<body><main><header><p class="eyebrow">ARENALAB / REFERENCE LABORATORY</p><h1>把每一次行动，变成可解释的结果。</h1><p>本地教学参考服务 · 非生产部署 · 权威状态由服务端裁决</p></header>
<section class="controls"><label>测试玩家 <select id="player"><option value="0">P0 · 青色</option><option value="1">P1 · 橙色</option></select></label><label>凭据 <input id="credential" value="arenalab-local-development:0" type="password"></label><button id="login">登录</button><label>模式 <select id="mode"><option value="turn">回合制 · 事务与恢复</option><option value="dedicated">实时 DS · 20 Hz</option></select></label><button id="match" disabled>匹配 / 分配</button><button id="reconnect" disabled>断开并重连</button></section>
<section class="arena"><div><canvas id="board" width="600" height="600" aria-label="两人竞技场"></canvas><div class="actions"><button data-action="move" data-dx="0" data-dy="-1">↑ / W</button><button data-action="move" data-dx="-1" data-dy="0">← / A</button><button data-action="move" data-dx="1" data-dy="0">→ / D</button><button data-action="move" data-dx="0" data-dy="1">↓ / S</button><button data-action="attack">攻击</button><button data-action="pass">跳过</button><label><input id="auto" type="checkbox">自动演示本方回合</label></div></div>
<aside><h2>可观察的状态</h2><dl><dt>连接 / 对局</dt><dd id="status">未登录</dd><dt>版本 / tick</dt><dd id="version">—</dd><dt>对局标识</dt><dd id="match-id">—</dd><dt>当前回合 / 胜者</dt><dd id="turn">—</dd><dt>RTT / 校正误差</dt><dd id="network">—</dd><dt>持久化积分</dt><dd id="score">0</dd><dt>承诺</dt><dd id="promise">行动 durable ACK；实时输入仅表示入队</dd></dl><h2>事件记录</h2><pre id="events"></pre></aside></section>
<footer>两个标签页分别选 P0 / P1，登录后使用同一模式。实时模式等待双方接入后运行30秒；回合制40次行动或击杀结束。关闭连接不暂停比赛。</footer></main><script src="/app.js"></script></body></html>
