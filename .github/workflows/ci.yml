name: starter-checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  starter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - run: test -z "$(gofmt -l cmd internal test)"
      - run: go vet ./...
      - run: go test -race ./... -timeout=60s
      - run: go run ./cmd/course check
      # Lab 01 acceptance intentionally requires the learner implementation.
      # Add a gate job when implementing Lab 01; never label starter green as gate passed.
